<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Razorpay Test Payment</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f5f7fb;
        }

        .payment-container {
            width: 90%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        h1 {
            margin-bottom: 10px;

            font-size: 28px;

            color: #222;
        }

        .subtitle {
            margin-bottom: 25px;

            color: #666;

            font-size: 15px;
        }

        .plan {
            padding: 20px;

            margin-bottom: 25px;

            border: 1px solid #e5e7eb;

            border-radius: 10px;
        }

        .plan-name {
            font-size: 20px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .price {
            font-size: 32px;

            font-weight: bold;

            margin-bottom: 5px;
        }

        .billing {
            color: #777;

            font-size: 14px;
        }

        #payButton {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        #payButton:hover {
            background: #1d4ed8;
        }

        #payButton:disabled {
            background: #9ca3af;

            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;

            white-space: pre-line;

            font-size: 14px;

            color: #333;
        }
    </style>
</head>

<body>

    <div class="payment-container">

        <h1>Candidate Pro Payment</h1>

        <p class="subtitle">
            Upgrade your TalentBridge AI account
        </p>

        <div class="plan">

            <div class="plan-name">
                JOB SEEKER PRO
            </div>

            <div class="price">
                ₹299
            </div>

            <div class="billing">
                Monthly Subscription
            </div>

        </div>

        <button id="payButton">
            Pay ₹299
        </button>

        <div id="message"></div>

    </div>


    <!-- Razorpay Checkout -->
    <script
        src="https://checkout.razorpay.com/v1/checkout.js">
    </script>

    <!-- Our payment JavaScript -->
    <script src="/payment.js"></script>

</body>

</html>
